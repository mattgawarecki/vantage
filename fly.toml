# Fly.io config. Rename app as you like, then:
#   fly launch --copy-config --no-deploy   (or `fly apps create vantage-playground`)
#   fly secrets set ANTHROPIC_API_KEY=sk-...   # spend-capped key
#   fly deploy
app = "vantage-playground"
primary_region = "sea"

[build]
  dockerfile = "deploy/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
